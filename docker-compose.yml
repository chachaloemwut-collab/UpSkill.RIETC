# Local development infrastructure only. Not used in production.
# Every port is bound to 127.0.0.1 so nothing is exposed to the LAN.
name: upskill

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: upskill_owner
      POSTGRES_PASSWORD: dev_owner_password
      POSTGRES_DB: upskill
    ports: ["127.0.0.1:55432:5432"]   # 55432 avoids clashing with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql   # PG18 image layout (data lives in a versioned subdirectory)
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upskill_owner -d upskill"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "dev_redis_password", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_redis_password", "ping"]
      interval: 5s
      retries: 10

  # Catches every outgoing email in dev. Web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  pgdata:
  redisdata:
