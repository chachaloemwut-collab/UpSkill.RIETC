name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (Dependabot keeps them updated via the trailing tag comments)
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  DATABASE_MIGRATION_URL: postgres://upskill_owner:dev_owner_password@localhost:55432/upskill
  DATABASE_URL: postgres://upskill_app:dev_app_password@localhost:55432/upskill
  REDIS_URL: redis://localhost:6379/0

jobs:
  branch-guard:
    # GitHub Free ไม่มี branch protection แบบเนทีฟสำหรับ repo ส่วนตัว — บังคับมาตรฐานตรงนี้แทน:
    # ทุก commit ที่ขึ้น main ต้องผ่าน Pull Request (ไม่งั้น CI แดง → release gate ใน Deploy Jasmine ไม่ผ่าน)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify every new commit came from a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::first push — skipping PR check"
            exit 0
          fi
          for sha in $(git rev-list "$BEFORE".."$AFTER"); do
            merged_at="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
              -H "Accept: application/vnd.github+json" --jq '.[0].merged_at // empty' 2>/dev/null || true)"
            if [ -z "$merged_at" ]; then
              echo "::error::commit $sha ขึ้น main โดยไม่ผ่าน Pull Request — ขัดมาตรฐานใน CONTRIBUTING.md/AGENTS.md (branch protection ฟรีแพลนไม่มี API จึงบังคับตรงนี้: CI จะแดงและ release gate จะไม่ผ่าน)"
              exit 1
            fi
          done
          echo "::notice::ทุก commit ใหม่บน main ผ่าน PR — OK"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: upskill_owner, POSTGRES_PASSWORD: dev_owner_password, POSTGRES_DB: upskill }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U upskill_owner -d upskill" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .nvmrc, package-manager-cache: false } # pnpm comes from corepack in the next step
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # Migrations must apply cleanly to a fresh DB, and the committed types must match them
      - run: PGPASSWORD=dev_owner_password psql -h localhost -p 55432 -U upskill_owner -d upskill -v ON_ERROR_STOP=1 -f infra/postgres/init/00-roles.sql
      - run: pnpm db:migrate
      - run: pnpm db:codegen && git diff --exit-code packages/db/src/generated.ts
      # Production hosting has a single DB role and migrates with role grants stripped: that path must parse too
      - name: Migrations apply in single-role mode (MIGRATION_SKIP_ROLE_GRANTS=1)
        run: |
          PGPASSWORD=dev_owner_password psql -h localhost -p 55432 -U upskill_owner -d upskill -v ON_ERROR_STOP=1 -c "CREATE DATABASE upskill_single_role"
          DATABASE_MIGRATION_URL=postgres://upskill_owner:dev_owner_password@localhost:55432/upskill_single_role MIGRATION_SKIP_ROLE_GRANTS=1 pnpm db:migrate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm run audit # the project script (prod deps, high+); bare `pnpm audit` is pnpm's builtin

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    env:
      # Throwaway CI database: lets the worker bootstrap the protected "superadmin" owner the tests expect
      SYSTEM_OWNER_PASSWORD: e2e-owner-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: upskill_owner, POSTGRES_PASSWORD: dev_owner_password, POSTGRES_DB: upskill }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U upskill_owner -d upskill" --health-interval 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .nvmrc, package-manager-cache: false } # pnpm comes from corepack in the next step
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:env # fresh signing key for this run; job env vars above take precedence
      - run: PGPASSWORD=dev_owner_password psql -h localhost -p 55432 -U upskill_owner -d upskill -v ON_ERROR_STOP=1 -f infra/postgres/init/00-roles.sql
      - run: pnpm db:migrate && pnpm db:seed
      - run: cd apps/worker && ./node_modules/.bin/playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @upskill/web build
      - name: Start web + worker
        run: |
          (cd apps/web && nohup ./node_modules/.bin/next start -p 3000 > ../../web.log 2>&1 &)
          (cd apps/worker && nohup ./node_modules/.bin/tsx --env-file-if-exists=../../.env.local src/index.ts > ../../worker.log 2>&1 &)
          for i in $(seq 1 60); do grep -q "worker started" worker.log 2>/dev/null && break; sleep 1; done
          grep -q "worker started" worker.log || { cat worker.log; exit 1; }
          for i in $(seq 1 60); do curl -fs -o /dev/null http://localhost:3000/ && exit 0; sleep 1; done; cat web.log; exit 1
      - run: pnpm test:e2e
      - if: failure()
        run: tail -n 100 web.log worker.log

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # CodeQL reads the workflow run (required on private repos)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with: { languages: javascript-typescript, queries: security-extended }
      # Code scanning is not enabled on this private repo (needs GitHub Code Security): keep the analysis, keep the
      # SARIF as a run artifact instead of uploading it. Switch to upload: always once code scanning is enabled.
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with: { upload: never, output: codeql-results }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: codeql-sarif, path: codeql-results, retention-days: 30 }
