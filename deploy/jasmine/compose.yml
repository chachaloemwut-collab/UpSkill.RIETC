# Hosting "มะลิ (Jasmine)" — runs from the upload root (/var/www/hosting/jasmine, SFTP path /files).
# The hosting admin starts it once; afterwards the `deployer` service rebuilds the app when the developer
# uploads a new release and writes deploy-request over SFTP (scripts/deploy-jasmine.sh deploy):
#
#   cd /var/www/hosting/jasmine
#   docker compose up -d --build          # first time (also starts the deployer)
#   docker compose logs -f web worker     # watch
#
# Secrets live in ./.env (uploaded separately, never part of the code bundle). Compose reads it both for
# ${REDIS_PASSWORD} below and, via env_file, as the app's environment.
name: jasmine

x-app: &app
  env_file: .env
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  # One-shot: applies pending SQL migrations, then exits. web/worker start only if it succeeded.
  migrate:
    <<: *app
    build: { context: ., dockerfile: infra/docker/worker.Dockerfile }
    image: jasmine-worker:latest
    command: ["node", "--import", "tsx", "/repo/packages/db/src/migrate.ts"]
    restart: "no"
    networks: [db]

  web:
    <<: *app
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    image: jasmine-web:latest
    environment:
      PORT: "34050"
      CERT_STORAGE_DIR: /data/certificates
    # Loopback only: the hosting's reverse proxy targets http://127.0.0.1:54744 and terminates HTTPS
    ports: ["127.0.0.1:54744:34050"]
    cap_drop: [ALL]
    volumes: [certificates:/data/certificates]
    networks: [internal, db]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    build: { context: ., dockerfile: infra/docker/worker.Dockerfile }
    image: jasmine-worker:latest
    environment:
      CERT_STORAGE_DIR: /data/certificates
    shm_size: "256m" # Chromium (certificate PDFs)
    volumes: [certificates:/data/certificates]
    networks: [internal, db]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Queue + rate limits + session locks. Private to this stack: no published port.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redis-data:/data]
    networks: [internal]

  # Self-service deploys (see deployer.sh). It holds the Docker socket, which is root-equivalent on the host:
  # it runs no network, no published port, a read-only filesystem, and only fixed compose commands for this project.
  deployer:
    image: docker:27.5.1-cli
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/var/www/hosting/jasmine/deployer.sh"]
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    environment:
      DOCKER_CONFIG: /tmp/docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/www/hosting/jasmine:/var/www/hosting/jasmine
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "3" }

volumes:
  certificates: # issued certificate PDFs — include in backups
  redis-data:

networks:
  internal: {}
  # Prepared by the hosting admin; the PostgreSQL host (d2dlzpu27ix28y) is only reachable on it
  db:
    external: true
    name: uldkkd9ywqslup
