<svg xmlns="http://www.w3.org/2000/svg" class="ur st-enrolling" viewBox="0 0 64 64" fill="none">
  <style>
.st-enrolling .sq-group { animation: stampPress 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 32px 52px; }
@keyframes stampPress {
0%, 100% { transform: translateY(0) scaleY(1); }
40% { transform: translateY(4px) scaleY(0.91); }
65% { transform: translateY(-2px) scaleY(1.03); }
    }
@media (prefers-reduced-motion: reduce), print { * { animation: none !important; } }
</style>
  <defs>
    <linearGradient id="bg-ur" x1="6" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#16345B"/>
    </linearGradient>
    <linearGradient id="g-ur" x1="42" y1="22" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4A03D"/>
      <stop offset="100%" stop-color="#FDE08D"/>
    </linearGradient>
  </defs>
  <g class="sq-group">
