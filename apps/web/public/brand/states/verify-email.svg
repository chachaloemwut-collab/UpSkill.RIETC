<svg xmlns="http://www.w3.org/2000/svg" class="ur st-verify-email" viewBox="0 0 64 64" fill="none">
  <style>
.st-verify-email .mail-dot { animation: pingRipple 1.5s ease-out 1; transform-origin: 51px 13px; }
.st-verify-email .sq-group { animation: floatY 1.8s ease-in-out 1; }
@keyframes pingRipple {
0% { transform: scale(0.7); opacity: 0.9; }
100% { transform: scale(1.9); opacity: 0; }
    }
@keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce), print { * { animation: none !important; } }
</style>
  <defs>
    <linearGradient id="bg-ur" x1="6" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#16345B"/>
    </linearGradient>
    <linearGradient id="g-ur" x1="42" y1="22" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4A03D"/>
      <stop offset="100%" stop-color="#FDE08D"/>
    </linearGradient>
  </defs>
  <g class="sq-group">
    <rect class="sq" x="4" y="4" width="56" height="56" rx="17" fill="url(#bg-ur)"/>
    <rect x="5" y="5" width="54" height="54" rx="16" stroke="rgba(255,255,255,0.26)" stroke-width="1.4"/>
    <path d="M 14 25 V 38 C 14 42.4 17.2 45 21 45 C 24.8 45 28 42.4 28 38 V 25" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 35 45 V 25 H 42 C 45.6 25 48 27.1 48 30 C 48 32.9 45.6 35 42 35 H 35 M 41.8 35 L 48.2 45" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle class="mail-dot" cx="51" cy="13" r="7" fill="none" stroke="#60A5FA" stroke-width="2.5"/>
  <circle cx="51" cy="13" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
</svg>
