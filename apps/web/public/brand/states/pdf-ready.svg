<svg xmlns="http://www.w3.org/2000/svg" class="ur st-pdf-ready" viewBox="0 0 64 64" fill="none">
  <style>
.st-pdf-ready .dl-arr { animation: bounceDown 1.2s ease-in-out 1; }
@keyframes bounceDown {
0%, 100% { transform: translateY(-3px); }
50% { transform: translateY(3px); }
    }
@media (prefers-reduced-motion: reduce), print { * { animation: none !important; } }
</style>
